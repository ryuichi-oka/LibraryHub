services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-libraryhub}
      POSTGRES_USER: ${POSTGRES_USER:-libraryhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libraryhub}
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-libraryhub} -d ${POSTGRES_DB:-libraryhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    environment:
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-libraryhub}:${POSTGRES_PASSWORD:-libraryhub}@db:5432/${POSTGRES_DB:-libraryhub}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-this-in-dev}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
    environment:
      NODE_ENV: development
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.26-alpine
    depends_on:
      - web
      - api
    volumes:
      - ./infra/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  pgdata:
